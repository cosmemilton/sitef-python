[package]
name = "sitef-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated CliSiTef native host; proprietary libraries are supplied by the integrator"

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
strip = true
lto = true

